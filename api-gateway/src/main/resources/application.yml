server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8094
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

            - id: auth-service-apikeys-list
              uri: http://localhost:8094
              predicates:
                - Path=/api/api-keys
              filters:
                - RewritePath=/api/api-keys, /api-keys

            - id: auth-service-apikeys-detail
              uri: http://localhost:8094
              predicates:
                - Path=/api/api-keys/**
              filters:
                - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/${segment}

            - id: course-service-list
              uri: http://localhost:8092
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            - id: course-service-detail
              uri: http://localhost:8092
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/${segment}

            - id: registration-service-list
              uri: http://localhost:8093
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            - id: registration-service-detail
              uri: http://localhost:8093
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/${segment}

            - id: course-service-partner
              uri: http://localhost:8092
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"

jwt:
  secret: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

management:
  endpoints:
    web:
      exposure:
        include: gateway